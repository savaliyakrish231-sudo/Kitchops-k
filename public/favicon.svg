<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KitchOps">
  <title>KitchOps</title>
  <!--
    The in-app brand mark: "KO" on the brand tile. The letters are drawn as
    geometry rather than <text> so the icon never depends on a font being
    available in whatever context renders it (tab bar, home screen, bookmark).

    The tile brightens on a dark browser chrome — Chrome and Firefox honour
    prefers-color-scheme inside an SVG favicon.
  -->
  <style>
    .tile { fill: #0f766e; }
    .mark { stroke: #ffffff; fill: none; stroke-width: 5; stroke-linecap: round; }
    .stem { fill: #ffffff; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #14b8a6; }
      .mark { stroke: #042f2e; }
      .stem { fill: #042f2e; }
    }
  </style>

  <rect class="tile" width="64" height="64" rx="14" />

  <!-- K -->
  <rect class="stem" x="12" y="20" width="5" height="24" rx="1.5" />
  <path class="mark" d="M17 32 L27 20.5" />
  <path class="mark" d="M17 32 L27 43.5" />

  <!-- O -->
  <circle class="mark" cx="41.5" cy="32" r="8" />
</svg>
