<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitchOps — Prep Kitchen Automation</title>
<script>
  /* No-flash theme bootstrap — must run before the stylesheet paints. */
  (function () {
    try {
      var m = localStorage.getItem('kitchops.theme');
      if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
    } catch (e) { /* storage blocked: fall back to the OS preference */ }
  })();
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ---------------------------------------------------------------- LOGIN -->
<div id="loginView" class="login-shell" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand">
      <span class="brand-mark">KO</span>
      <div>
        <h1>KitchOps</h1>
        <p>Prep Kitchen Automation</p>
      </div>
    </div>
    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="form-error" id="loginError" hidden></p>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div>

<!-- ------------------------------------------------------------ APP SHELL -->
<div id="appView" class="app-shell" hidden>
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    <span class="brand-mark small">KO</span>
    <strong class="topbar-title">KitchOps</strong>
    <!-- Identity, appearance, password and sign out live in the sidebar's
         Account group, so the topbar stays out of the way. -->
  </header>

  <div class="body-grid">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="toastHost" class="toast-host"></div>
<div id="modalHost" class="modal-host" hidden></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/users.js"></script>
<script src="/js/pages/credentials.js"></script>
<script src="/js/pages/account.js"></script>
<script src="/js/pages/stations.js"></script>
<script src="/js/pages/locations.js"></script>
<script src="/js/pages/recipes.js"></script>
<script src="/js/pages/counter.js"></script>
<script src="/js/pages/masters.js"></script>
<script src="/js/pages/mytasks.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
